# OxiDav — example Compose deployment (F15).
#
# Build & run:
#   docker compose up -d --build          # or: podman-compose up -d --build
#
# The image is built by the multi-stage `Dockerfile`; `web/dist` is produced
# inside the `web` stage, so no local frontend build is required beforehand.
#
# The SQLite database lives on a named volume mounted at /app/data, which is
# where `OXIDAV_DATABASE_URL=sqlite://data/oxidav.db` resolves to.
services:
  oxidav:
    build:
      context: .
      dockerfile: Dockerfile
    image: oxidav:latest
    container_name: oxidav
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Listen address. Keep 0.0.0.0 inside the container.
      OXIDAV_BIND_ADDR: "0.0.0.0:8080"
      # SQLite file, relative to WORKDIR (/app) -> /app/data/oxidav.db
      OXIDAV_DATABASE_URL: "sqlite://data/oxidav.db"
      # --- Authentication (OIDC / Pocket ID) ---------------------------------
      # Disabled by default: the container boots with no IdP in dev mode, where
      # the API acts as the dev user and GET /api/auth/login + /api/auth/callback
      # return 404. To enable authentication, uncomment and fill in ALL seven
      # values below. With AUTH_ENABLED=true they are mandatory and fail-closed:
      # any empty one aborts startup.
      # AUTH_ENABLED: "true"
      # AUTH_ISSUER_URL: "https://pocket-id.example.com"
      # AUTH_CLIENT_ID: "oxidav-spa"
      # AUTH_CLIENT_SECRET: "<confidential-client-secret>"
      # AUTH_REDIRECT_URL: "https://oxidav.example.com/api/auth/callback"
      # AUTH_POST_LOGOUT_REDIRECT_URL: "https://oxidav.example.com/"
      # JWT_SECRET: "<long-random-hs256-secret>"
      # tracing filter / level
      RUST_LOG: "info"
    volumes:
      - oxidav-data:/app/data
    networks:
      - oxidav
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  oxidav-data:

networks:
  oxidav:
    driver: bridge
