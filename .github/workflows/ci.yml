name: CI

# Build order matters: rust-embed embeds web/dist AT COMPILE TIME.
# So the frontend job runs first, uploads web/dist as an artifact, and the
# backend job downloads it before compiling/testing.
#
#   frontend (npm build) -> artifact web-dist -> backend (cargo fmt/clippy/test)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # 1. Frontend: build the SPA first; its web/dist is the cargo build input.
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node 22 (npm cache)
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Test
        run: npx vitest run

      - name: Build SPA (produces web/dist)
        run: npm run build

      # Ship web/dist to the backend job so rust-embed embeds the REAL bundle.
      # upload-artifact uploads the *contents* of `web/dist` (index.html,
      # assets/…), not the `dist/` folder itself. The backend restores it into
      # `web/dist` so the file lands at `web/dist/index.html`.
      - name: Upload web/dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 2. Backend: needs the SPA bundle; fmt + clippy + tests (debug build).
  #    `sqlite` (bundled) and `aws-lc-rs` compile C, which the stock
  #    ubuntu-latest C toolchain already provides (no extra installs needed).
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (Rust stable)
    runs-on: ubuntu-latest
    needs: frontend
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      # Materialize the real SPA at web/dist before cargo touches web/dist,
      # so rust-embed embeds it and asset tests are not skipped.
      - name: Download web/dist artifact
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist

      - name: Verify web/dist is present
        run: test -f web/dist/index.html

      - name: Format check
        run: cargo fmt --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked
