[package]
name = "oxidav"
version = "0.3.1"
edition = "2024"
# Guarantees `web/dist` exists at compile time for `rust-embed` (F15).
build = "build.rs"

[lib]
name = "oxidav"
path = "src/lib.rs"

[[bin]]
name = "oxidav"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "sync"] }
# TODO(F06): enable the "cors" feature when the REST API lands.
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# F04: `derive` is required for the OIDC `Claims` struct (and later F06 DTOs).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# F15: embeds `web/dist` into the binary so the SPA ships with the API and DAV
# surface in a single distributable executable. `web/dist` must be built before
# `cargo build`; `build.rs` guarantees the folder exists.
rust-embed = "8"
# F03: async SQLite driver. The `sqlite` feature pulls `libsqlite3-sys` with
# `bundled`, guaranteeing a build with FTS5 + the `trigram` tokenizer.
sqlx = { version = "0.8", default-features = false, features = [
    "sqlite",
    "runtime-tokio",
    "macros",
    "migrate",
] }
# F04/F17: OIDC (Pocket ID) RS256 verification + HS256 session signing.
# `rust_crypto` selects the pure-Rust backend (RSA + SHA-256), preserving the
# "no OpenSSL" property of the static binary. F17 ports valet's OIDC flow but
# deliberately **keeps** `rust_crypto` instead of valet's `aws_lc_rs`: valet
# links `aws-lc-sys` (a C/assembly build) and OxiDav ships a static musl binary
# where that is unwanted. This is design parity with valet, not feature parity.
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
# F04/F17: JWKS + OIDC discovery download. `default-features = false` drops the
# native-tls/system-proxy stack; `rustls` (with aws-lc-rs, so not OpenSSL) and
# `json` are the only things needed to fetch `openid-configuration`/JWKS. The
# `stream` feature (F17) is required by `session::read_limited_json`, which caps
# the response body by summing chunks as they arrive, not only via
# `content-length`.
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls",
    "stream",
] }
# F17: `CookieJar`/`Set-Cookie` extractors for the OIDC server-side flow
# (`/api/auth/*`). Only the `cookie` feature is pulled; the rest of axum-extra
# stays out.
axum-extra = { version = "0.10", features = ["cookie"] }
# F17: `cookie::time::Duration` for computing cookie `Max-Age` values. Declared
# directly so the auth routes can name the type without relying on axum-extra's
# re-export.
cookie = "0.18"
# F17: parse and mutate URLs (query string building for `authorize`/`end_session`
# and origin comparison of `jwks_uri`, RFC 8414). `reqwest` already pulls `url`
# transitively, but a direct dependency is required to `use url::…` here.
url = "2"
# F17: `StreamExt::next` over `reqwest`'s chunked body stream for the size-capped
# reader (`session::read_limited_json`).
futures = "0.3"
# F05: app-token secret hashing (SHA-256, or HMAC-SHA256 with an optional pepper).
sha2 = "0.10"
hmac = "0.12"
# F05: constant-time comparison (`ConstantTimeEq`) of secret digests.
subtle = "2"
# F05: CSPRNG (`OsRng`) for token ids and secrets. Also used by the F04 tests to
# generate an in-memory RSA key pair.
rand = "0.8"
# F05: decode `Authorization: Basic <base64>` credentials (also used by F04
# tests to hand-roll the `alg=none` token).
base64 = "0.22"
# F07: DAV XML reading/writing (`207 Multi-Status`, PROPFIND/REPORT bodies).
# quick-xml never parses DTDs nor resolves external/general entities, which
# structurally rules out XXE and billion-laughs; on top of that we reject
# `Event::DocType` outright (see `src/dav/xml.rs`). Default features only pull
# `memchr`; no TLS/encoding/serde stack is added.
quick-xml = "0.42"
# F07: iCalendar (.ics) parsing. `default-features = false` drops `chrono-tz`
# (TZID/VTIMEZONE), `recurrence` (RRULE expansion) and `serde`, none of which
# F07 needs; the `parser` feature keeps `FromStr for Calendar`.
icalendar = { version = "0.17", default-features = false, features = ["parser"] }
# F08: percent-encode/decode DAV `href` path segments. A `UID` is opaque text
# (may carry `@`, `#`, `?`, spaces or non-ASCII), so it must be escaped when
# emitted as a URL segment and unescaped when a client-supplied `href` is
# resolved back to a stored `UID`.
percent-encoding = "2"
# F08: vCard (.vcf) parsing. `default-features = false` drops `zeroize` (we keep
# the raw payload ourselves and never need at-rest zeroing) and the optional
# `serde`/`language-tags`/`mime` integrations; only the RFC 6350 parser core is
# pulled. `parse_loose` tolerates cards whose individual properties are invalid.
vcard4 = { version = "0.7", default-features = false }
# Timezone support: IANA TZID handling (validation + offsets) for the
# denormalised `dtstart_tzid`/`dtend_tzid` columns. Pure Rust, no OpenSSL.
chrono-tz = "0.10"
# F18: `VTIMEZONE` derivation needs to build a `chrono::DateTime` to sample a
# zone's offset through `chrono_tz::Tz`'s `chrono::TimeZone` impl (chrono-tz
# 0.10 does not expose its transition tables). `chrono` 0.4 is already in the
# tree via `icalendar`; declaring it directly adds no new crate and keeps the
# static-musl / no-OpenSSL property intact.
chrono = { version = "0.4", default-features = false, features = ["std"] }

[dev-dependencies]
# `tower::ServiceExt::oneshot` is only needed by the router integration tests.
tower = { version = "0.5", features = ["util"] }
# `tokio::time::timeout` is only needed by the shutdown-signal unit tests.
tokio = { version = "1", features = ["time"] }
# F17: in-process HTTP server that serves a fake JWKS/discovery document to the
# `session` unit tests, so `validate_id_token`/`discover` are exercised without
# a real IdP.
wiremock = "0.6"
